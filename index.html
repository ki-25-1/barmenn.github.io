<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar Manager - Фонтан</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; border-radius: 12px; }
        .btn-xl { padding: 18px; font-size: 1.3rem; width: 100%; font-weight: bold; border-radius: 10px; }
        
        /* Стиль для живого пошуку */
        .search-box { 
            border: 2px solid #0d6efd; 
            border-radius: 8px; 
            padding: 12px; 
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        /* Стилі звіту для друку */
        #reportTable { width: 100%; border-collapse: collapse; background: white; font-family: 'Courier New', monospace; font-size: 14px; }
        #reportTable th, #reportTable td { border: 1px solid #000; padding: 6px; }
        #reportTable th { background-color: #f0f0f0; text-align: left; }
        
        .history-sale { color: #dc3545; font-weight: bold; }
        .history-supply { color: #198754; font-weight: bold; }
        .print-header { display: none; }

        @media print {
    body * { visibility: hidden; }
    #pills-report, #pills-report * { visibility: visible; }
    #pills-report { position: absolute; left: 0; top: 0; width: 100%; }
    .no-print { display: none !important; }
    
    /* Новий стиль заголовка */
    .print-header { 
        display: flex !important; /* Робимо блок гнучким */
        justify-content: space-between; /* Назва вліво, дата вправо */
        align-items: center;
        border-bottom: 2px solid #000;
        margin-bottom: 15px;
        padding-bottom: 5px;
        font-family: 'Courier New', monospace;
        font-size: 18px;
        font-weight: bold;
    }
}
    </style>
</head>
<body>

<div class="container py-4">
    <h2 class="text-center mb-4">🍺 Bar Manager: Фонтан</h2>

    <ul class="nav nav-pills mb-3 justify-content-center no-print" id="pills-tab" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#pills-sale">💰 Продаж</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-supply">🚚 Поставка</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-history">📜 Історія</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-report">📄 Звіт</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-add">➕ Товар</button></li>
    </ul>

    <div class="tab-content" id="pills-tabContent">
        
        <div class="tab-pane fade show active" id="pills-sale">
            <div class="card p-4">
                <h4>Швидкий продаж</h4>
                <div class="mb-3">
                    <label class="form-label">🔍 Пошук товару:</label>
                    <input list="productsList" id="saleSearch" class="form-control search-box" placeholder="Введіть назву або код..." oninput="handleSearch('sale')">
                    <input type="hidden" id="saleProductId">
                    <small id="saleHint" class="text-primary fw-bold"></small>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Кількість:</label>
                        <div class="input-group">
                            <input type="number" step="0.001" id="saleAmount" class="form-control form-control-lg">
                            <span class="input-group-text" id="saleUnit">од</span>
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Акцизний код:</label>
                        <input type="text" id="exciseCode" class="form-control form-control-lg" placeholder="Сканувати...">
                    </div>
                </div>
                <button onclick="processTransaction('sale')" class="btn btn-danger btn-xl">ПРОДАТИ</button>
            </div>
        </div>

        <div class="tab-pane fade" id="pills-supply">
            <div class="card p-4">
                <h4>Прийом товару на склад</h4>
                <div class="mb-3">
                    <label class="form-label">🔍 Оберіть товар:</label>
                    <input list="productsList" id="supplySearch" class="form-control search-box" placeholder="Шукати за назвою..." oninput="handleSearch('supply')">
                    <input type="hidden" id="supplyProductId">
                </div>
                <div class="mb-3">
                    <label>Кількість поставки:</label>
                    <div class="input-group">
                        <input type="number" step="0.001" id="supplyAmount" class="form-control form-control-lg">
                        <span class="input-group-text" id="supplyUnit">од</span>
                    </div>
                </div>
                <button onclick="processTransaction('supply')" class="btn btn-success btn-xl">ДОДАТИ НА СКЛАД</button>
            </div>
        </div>

        <div class="tab-pane fade" id="pills-history">
            <div class="card p-3">
                <h4>Останні 50 операцій</h4>
                <div class="table-responsive">
                    <table class="table table-sm table-hover">
                        <thead>
                            <tr><th>Час</th><th>Дія</th><th>Товар</th><th>К-сть</th><th>Акциз</th></tr>
                        </thead>
                        <tbody id="historyBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="pills-report">
            <div class="d-flex justify-content-between mb-3 no-print">
                <h4>Залишки на складі</h4>
                <button onclick="window.print()" class="btn btn-primary">🖨️ Друкувати звіт</button>
            </div>
            <div class="print-header">
                <span>фонтан</span>
                <span id="reportDate"></span>
            </div>
            <table id="reportTable">
                <thead>
                    <tr><th>Код</th><th>Назва товару</th><th>Од.</th><th>Залишок</th><th class="no-print">Дії</th></tr>
                </thead>
                <tbody id="reportBody"></tbody>
            </table>
        </div>

        <div class="tab-pane fade" id="pills-add">
            <div class="card p-4">
                <h4>Нова картка товару</h4>
                <div class="row">
                    <div class="col-md-6 mb-2"><label>Код:</label><input type="text" id="newCode" class="form-control"></div>
                    <div class="col-md-6 mb-2"><label>Назва:</label><input type="text" id="newName" class="form-control"></div>
                </div>
                <div class="row mb-2">
                    <div class="col-6">
                        <label>Одиниця:</label>
                        <select id="newUnit" class="form-select"><option value="л">Літри</option><option value="шт">Штуки</option></select>
                    </div>
                    <div class="col-6">
                        <label>Станд. порція:</label>
                        <input type="number" step="0.001" id="newDefaultPortion" class="form-control" value="0.5">
                    </div>
                </div>
                <div class="mb-3"><label>Початковий залишок:</label><input type="number" step="0.001" id="newStartQty" class="form-control" value="0"></div>
                <button onclick="addNewProduct()" class="btn btn-dark w-100 py-3">ЗБЕРЕГТИ ТОВАР</button>
            </div>
        </div>

    </div>
</div>

<datalist id="productsList"></datalist>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp, query, orderBy, limit } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // --- КЛЮЧІ FIREBASE ---
    const firebaseConfig = {
        apiKey: "AIzaSyC7B4x"+"-ttIJLNz0bQu_"+"uyWkqJGtCGZQfIU",
        authDomain: "barmenn-app.firebaseapp.com",
        projectId: "barmenn-app",
        storageBucket: "barmenn-app.firebasestorage.app",
        messagingSenderId: "493378647415",
        appId: "1:493378"+"647415:web:f8a30f3"+"f473a8e7d131d72"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const productsCol = collection(db, 'products');
    const logsCol = collection(db, 'logs');

    let allProducts = [];

    // Допоміжна функція форматування
    const formatQty = (num, unit) => (unit === 'л' ? parseFloat(num).toFixed(3) : Math.floor(num));

    // 1. СЛУХАЄМО БАЗУ ТОВАРІВ
    onSnapshot(productsCol, (snapshot) => {
        allProducts = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        updateInterface();
    });

    function updateInterface() {
        const datalist = document.getElementById('productsList');
        const reportBody = document.getElementById('reportBody');
        
        datalist.innerHTML = '';
        reportBody.innerHTML = '';

        // Сортуємо для звіту за кількістю (від більшого)
        const sortedProducts = [...allProducts].sort((a, b) => (b.quantity || 0) - (a.quantity || 0));

        sortedProducts.forEach(p => {
            // Додаємо в список підказок для пошуку
            const opt = document.createElement('option');
            opt.value = p.name;
            opt.label = `Код: ${p.code || '-'} | Зал: ${formatQty(p.quantity, p.unit)}`;
            datalist.appendChild(opt);

            // Додаємо в таблицю звіту
            reportBody.innerHTML += `
                <tr>
                    <td>${p.code || '-'}</td>
                    <td>${p.name}</td>
                    <td>${p.unit}</td>
                    <td><b>${formatQty(p.quantity, p.unit)}</b></td>
                    <td class="no-print text-center">
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct('${p.id}', '${p.name}')">🗑️</button>
                    </td>
                </tr>`;
        });
    }

    // 2. ЖИВИЙ ПОШУК ТА АВТОВИБІР
    window.handleSearch = (type) => {
        const input = document.getElementById(type + 'Search');
        const hiddenId = document.getElementById(type + 'ProductId');
        const unitLabel = document.getElementById(type + 'Unit');
        const amountInput = document.getElementById(type + 'Amount');
        const hint = document.getElementById('saleHint');

        const product = allProducts.find(p => p.name === input.value);

        if (product) {
            hiddenId.value = product.id;
            unitLabel.innerText = product.unit;
            if (type === 'sale') {
                amountInput.value = product.defaultPortion;
                hint.innerText = `Залишок: ${formatQty(product.quantity, product.unit)} ${product.unit}`;
            }
        } else {
            hiddenId.value = "";
            if (type === 'sale') hint.innerText = "";
        }
    };

    // 3. ПРОВЕДЕННЯ ОПЕРАЦІЇ (ПРОДАЖ / ПОСТАВКА)
    window.processTransaction = async (type) => {
        const id = document.getElementById(type + 'ProductId').value;
        const amount = parseFloat(document.getElementById(type + 'Amount').value);
        const excise = document.getElementById('exciseCode')?.value || "";

        if (!id || isNaN(amount) || amount <= 0) return alert("Спочатку оберіть товар зі списку!");

        const product = allProducts.find(p => p.id === id);
        let newQty = (product.quantity || 0) + (type === 'sale' ? -amount : amount);

        if (type === 'sale' && product.quantity < amount) {
            if (!confirm("Недостатньо залишку. Продати в мінус?")) return;
        }

        try {
            await updateDoc(doc(db, 'products', id), { quantity: newQty });
            await addDoc(logsCol, {
                productName: product.name,
                type: type,
                amount: amount,
                exciseCode: excise || "N/A",
                timestamp: serverTimestamp()
            });

            // Очищення полів
            document.getElementById(type + 'Search').value = "";
            document.getElementById(type + 'Amount').value = "";
            if (type === 'sale') document.getElementById('exciseCode').value = "";
            alert("✅ Успішно!");
        } catch (e) { alert("Помилка: " + e.message); }
    };

    // 4. ІСТОРІЯ (ЛОГИ)
    onSnapshot(query(logsCol, orderBy("timestamp", "desc"), limit(50)), (snap) => {
        const hb = document.getElementById('historyBody');
        hb.innerHTML = '';
        snap.forEach(d => {
            const data = d.data();
            const date = data.timestamp ? data.timestamp.toDate().toLocaleString('uk-UA', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}) : '...';
            hb.innerHTML += `
                <tr>
                    <td>${date}</td>
                    <td>${data.type === 'sale' ? '<span class="history-sale">Продаж</span>' : '<span class="history-supply">Поставка</span>'}</td>
                    <td>${data.productName}</td>
                    <td>${data.amount}</td>
                    <td><small>${data.exciseCode}</small></td>
                </tr>`;
        });
    });

    // 5. ДОДАВАННЯ НОВОГО ТОВАРУ
    window.addNewProduct = async () => {
        const name = document.getElementById('newName').value;
        const code = document.getElementById('newCode').value;
        const unit = document.getElementById('newUnit').value;
        const portion = parseFloat(document.getElementById('newDefaultPortion').value);
        const startQty = parseFloat(document.getElementById('newStartQty').value);

        if (!name || isNaN(portion)) return alert("Заповніть назву та порцію!");

        await addDoc(productsCol, { name, code, unit, defaultPortion: portion, quantity: startQty || 0 });
        alert("Товар додано!");
        document.querySelectorAll('#pills-add input').forEach(i => i.value = (i.id === 'newStartQty' ? "0" : ""));
    };

    // 6. ВИДАЛЕННЯ
    window.deleteProduct = async (id, name) => {
        if (prompt("Введіть пароль для видалення:") === "4748") {
            if (confirm(`Видалити товар "${name}"?`)) {
                await deleteDoc(doc(db, "products", id));
            }
        } else { alert("Невірний пароль!"); }
    };

    document.getElementById('reportDate').innerText = new Date().toLocaleDateString('uk-UA');
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
